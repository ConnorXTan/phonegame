<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTN // KILLCAMS</title>
<style>
  :root {
    --bg: #05070f;
    --surface: rgba(255, 255, 255, 0.06);
    --hairline: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --primary: #4ce637;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    min-height: 100vh;
    padding: 32px 24px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 16px;
  }
  h1 { font-size: 22px; font-weight: 800; letter-spacing: 3px; }
  h1 span { color: var(--primary); }
  #count { color: var(--text-dim); font-size: 13px; }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
  }
  .card video { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: #000; }
  .card figcaption { padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .card b { color: var(--primary); font-weight: 700; }
  .card time { display: block; color: var(--text-dim); font-size: 11px; }
  #empty { color: var(--text-dim); padding: 48px 0; text-align: center; font-size: 14px; }
</style>
</head>
<body>
  <header>
    <h1>LTN <span>//</span> KILLCAMS</h1>
    <div id="count"></div>
  </header>
  <main id="grid"></main>
  <div id="empty" hidden>No killcams published yet.</div>
  <script>
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);
    let lastKey = '';

    async function load() {
      try {
        const { clips } = await (await fetch('/api/clips')).json();
        const key = clips.map((c) => c.url).join('|');
        if (key === lastKey) return;   // don't interrupt playing videos
        lastKey = key;
        count.textContent = `${clips.length} clip${clips.length === 1 ? '' : 's'}`;
        empty.hidden = clips.length > 0;
        grid.innerHTML = clips.map((c) => `
          <figure class="card">
            <video src="${esc(c.url)}" controls muted playsinline preload="metadata" loop></video>
            <figcaption>
              <b>${esc(c.killer)}</b> eliminated <b>${esc(c.victim)}</b>
              <time>${new Date(c.timestamp).toLocaleString()}</time>
            </figcaption>
          </figure>`).join('');
      } catch (e) { /* transient; next poll retries */ }
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
