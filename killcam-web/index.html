<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTN // KILLCAMS</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preload" href="/fonts/Myfont-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/Myfont-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
  /* The brand face the app ships (Echo/Fonts); weights beyond 400/700 would
     synthesize, so the sheet only ever asks for these two. */
  @font-face {
    font-family: "Myfont";
    src: url("/fonts/Myfont-Regular.ttf") format("truetype");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "Myfont";
    src: url("/fonts/Myfont-Bold.ttf") format("truetype");
    font-weight: 700;
    font-display: swap;
  }
  :root {
    --bg: #05070f;
    --surface: rgba(255, 255, 255, 0.06);
    --hairline: rgba(255, 255, 255, 0.1);
    --text: #ffffff;
    --text-dim: rgba(255, 255, 255, 0.6);
    --primary: #4ce637;
    --danger: #ef4040;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Myfont", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    min-height: 100vh;
    padding: 32px 24px 64px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 28px;
    border-bottom: 1px solid var(--hairline);
    padding-bottom: 16px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: 3px; }
  h1 span { color: var(--primary); }
  #count { color: var(--text-dim); font-size: 13px; }
  #savedToggle {
    margin-left: auto;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
  }
  #savedToggle.on { color: var(--primary); border-color: var(--primary); }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    overflow: hidden;
  }
  .thumb {
    position: relative;
    cursor: pointer;
  }
  .thumb video {
    width: 100%;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    display: block;
    background: #000;
    pointer-events: none;   /* the whole thumb is one click target */
  }
  .thumb .play {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 34px;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
  }
  .card figcaption { padding: 10px 12px; font-size: 12px; line-height: 1.5; }
  .card b { color: var(--primary); font-weight: 700; }
  .card time { display: block; color: var(--text-dim); font-size: 11px; }
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .actions button {
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text-dim);
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    cursor: pointer;
  }
  .actions button.on-like { color: var(--danger); border-color: var(--danger); }
  .actions button.on-save { color: var(--primary); border-color: var(--primary); }
  #empty { color: var(--text-dim); padding: 48px 0; text-align: center; font-size: 14px; }

  /* Lightbox: most of the screen, never native fullscreen, never cropped. */
  #lightbox {
    position: fixed;
    inset: 0;
    display: none;
    place-items: center;
    background: rgba(3, 4, 9, 0.92);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  #lightbox.open { display: grid; }
  #lightbox .frame {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    max-width: 92vw;
  }
  #lightbox video {
    max-width: 92vw;
    max-height: 82vh;
    object-fit: contain;    /* true aspect — no zooming, no cropping */
    border-radius: 12px;
    background: #000;
  }
  #lightbox .caption { font-size: 13px; color: var(--text-dim); }
  #lightbox .caption b { color: var(--primary); }
  #lightboxClose {
    position: fixed;
    top: 18px;
    right: 22px;
    background: none;
    border: 1px solid var(--hairline);
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <header>
    <h1>LTN <span>//</span> KILLCAMS</h1>
    <div id="count"></div>
    <button id="savedToggle">Saved</button>
  </header>
  <main id="grid"></main>
  <div id="empty" hidden>No killcams published yet.</div>

  <div id="lightbox">
    <button id="lightboxClose">Close ✕</button>
    <div class="frame">
      <video id="lightboxVideo" controls playsinline loop></video>
      <div class="caption" id="lightboxCaption"></div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    const savedToggle = document.getElementById('savedToggle');
    const lightbox = document.getElementById('lightbox');
    const lightboxVideo = document.getElementById('lightboxVideo');
    const lightboxCaption = document.getElementById('lightboxCaption');
    const esc = (s) => s.replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

    // Anonymous per-browser identity: one like per device per clip. Minted
    // once, kept in localStorage.
    let device = localStorage.getItem('ltn-device');
    if (!device) {
      device = crypto.randomUUID().replace(/-/g, '');
      localStorage.setItem('ltn-device', device);
    }
    fetch(`/api/react?action=visit&device=${device}`, { method: 'POST' });

    let clips = [];
    let savedOnly = false;
    let lastKey = '';

    savedToggle.onclick = () => {
      savedOnly = !savedOnly;
      savedToggle.classList.toggle('on', savedOnly);
      render();
    };

    // Thumbnails hold off on fetching until the card nears the viewport —
    // a page of eager <video> elements is what made the grid crawl.
    const thumbObserver = new IntersectionObserver((entries) => {
      for (const entry of entries) {
        if (!entry.isIntersecting) continue;
        const video = entry.target;
        if (!video.src && video.dataset.src) {
          video.preload = 'metadata';
          video.src = video.dataset.src;
        }
        thumbObserver.unobserve(video);
      }
    }, { rootMargin: '400px' });

    function openClip(key) {
      const clip = clips.find((c) => c.key === key);
      if (!clip) return;
      lightboxVideo.src = clip.url;
      lightboxVideo.muted = false;
      lightboxCaption.innerHTML =
        `<b>${esc(clip.killer)}</b> eliminated <b>${esc(clip.victim)}</b> · ${new Date(clip.timestamp).toLocaleString()}`;
      lightbox.classList.add('open');
      lightboxVideo.play().catch(() => {});
    }
    function closeClip() {
      lightbox.classList.remove('open');
      lightboxVideo.pause();
      lightboxVideo.removeAttribute('src');
      lightboxVideo.load();
    }
    window.openClip = openClip;
    document.getElementById('lightboxClose').onclick = closeClip;
    lightbox.onclick = (e) => { if (e.target === lightbox) closeClip(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeClip(); });

    async function react(key, action) {
      const clip = clips.find((c) => c.key === key);
      if (!clip) return;
      // Optimistic flip; the next poll reconciles with the server's truth.
      if (action === 'toggle-like') {
        clip.liked = !clip.liked;
        clip.likes += clip.liked ? 1 : -1;
        fetch(`/api/react?action=${clip.liked ? 'like' : 'unlike'}&clip=${encodeURIComponent(key)}&device=${device}`, { method: 'POST' });
      } else {
        clip.saved = !clip.saved;
        fetch(`/api/react?action=${clip.saved ? 'save' : 'unsave'}&clip=${encodeURIComponent(key)}&device=${device}`, { method: 'POST' });
      }
      render();
    }
    window.react = react;

    function render() {
      const visible = savedOnly ? clips.filter((c) => c.saved) : clips;
      count.textContent = `${visible.length} clip${visible.length === 1 ? '' : 's'}`;
      empty.hidden = visible.length > 0;
      // The grid only rebuilds when the SET of clips changes. Rebuilding on a
      // like meant every thumbnail video was torn down and re-downloaded —
      // counts and button states refresh in place instead.
      const structure = visible.map((c) => c.key).join('~');
      if (structure !== lastKey) {
        lastKey = structure;
        grid.innerHTML = visible.map((c) => `
          <figure class="card" data-card="${esc(c.key)}">
            <div class="thumb" onclick="openClip('${esc(c.key)}')">
              <!-- #t=0.1 makes browsers decode and paint that frame as the
                   poster; bare preload="metadata" often leaves black. The src
                   waits in data-src until the card scrolls near the viewport. -->
              <video data-src="${esc(c.url)}#t=0.1" muted playsinline preload="none"></video>
              <div class="play">&#9655;</div>
            </div>
            <figcaption>
              <b>${esc(c.killer)}</b> eliminated <b>${esc(c.victim)}</b>
              <time>${new Date(c.timestamp).toLocaleString()}</time>
              <div class="actions">
                <button class="like" onclick="react('${esc(c.key)}', 'toggle-like')"></button>
                <button class="save" onclick="react('${esc(c.key)}', 'toggle-save')"></button>
              </div>
            </figcaption>
          </figure>`).join('');
        grid.querySelectorAll('video[data-src]').forEach((v) => thumbObserver.observe(v));
      }
      for (const c of visible) {
        const card = grid.querySelector(`[data-card="${CSS.escape(c.key)}"]`);
        if (!card) continue;
        const like = card.querySelector('.like');
        like.classList.toggle('on-like', c.liked);
        like.innerHTML = `&hearts; ${c.likes}`;
        const save = card.querySelector('.save');
        save.classList.toggle('on-save', c.saved);
        save.textContent = c.saved ? 'Saved' : 'Save';
      }
    }

    async function load() {
      try {
        const reply = await (await fetch(`/api/clips?device=${device}`)).json();
        clips = reply.clips;
        render();
      } catch (e) { /* transient; next poll retries */ }
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
